name: Build kernel

# Personal GKI build: stock AOSP android16-6.12, pinned to common tag 6.12.38 + SPL 2025-09.
# Repo/manifest sync for the full tree, then pin kernel/common to the config tag/SHA.
# Optional root (KSU variants) and SUSFS via workflow inputs; default is unrooted.
# Manual trigger only; builds run in CI.

on:
  workflow_dispatch:
    inputs:
      spl:
        description: "SPL (patch date)"
        type: choice
        options:
          - All
          - 2025-09
        default: 2025-09
      use_cache:
        description: "Enable bazel cache (actions/cache)"
        type: boolean
        default: true
      use_source_cache:
        description: "Reuse synced kernel source via actions/cache"
        type: boolean
        default: true
      brand_name:
        description: "Optional kernel branding. Empty keeps the stock GKI version."
        type: string
        default: ""
        required: false
      allow_version_mismatch:
        description: "Force-load modules with mismatched symbol versions (Wild-style bypass)"
        type: boolean
        default: true
      free_disk_space:
        description: "Free disk space before build (disable to skip)"
        type: boolean
        default: true
      build_method:
        description: "Build method (kleaf via tools/bazel; auto kept for compatibility)"
        type: choice
        options:
          - auto
          - kleaf
        default: auto
      remove_protected_exports:
        description: "Remove GKI protected exports so vendor modules can load (Wild-style)"
        type: boolean
        default: true
      root_flavor:
        description: "Root implementation (baseline = no root)"
        type: choice
        options:
          - baseline
          - ksu
          - ksunext
          - sukisu-ultra
          - resukisu
        default: baseline
      with_susfs:
        description: "Apply SUSFS root-hiding patches (requires a root flavor)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          SEL="$(printf '%s' '${{ inputs.spl }}' | tr '[:upper:]' '[:lower:]')"
          [ "$SEL" = "all" ] && SEL=""
          JSON="$(cat .github/config/android16-6.12.json)"
          if [ -n "$SEL" ]; then
            M="$(echo "$JSON" | jq -c --arg s "$SEL" '{include: [.include[] | select(.date == $s)]}')"
          else
            M="$(echo "$JSON" | jq -c '{include}')"
          fi
          if [ "$(echo "$M" | jq '.include | length')" -eq 0 ]; then
            echo "No targets match spl='${{ inputs.spl }}'" >&2
            exit 1
          fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M" | jq .

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    name: "6.12.${{ matrix.sublevel }}-android16-${{ matrix.date }}"
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        if: inputs.free_disk_space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

      - name: Restore kernel source cache
        id: restore-kernel
        if: inputs.use_source_cache
        uses: actions/cache/restore@v6
        with:
          path: kernel
          key: kernel-src-android16-6.12-${{ matrix.sublevel }}-${{ matrix.date }}-${{ hashFiles('.github/config/android16-6.12.json') }}
          restore-keys: |
            kernel-src-android16-6.12-${{ matrix.sublevel }}-${{ matrix.date }}-

      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl python3 jq ccache
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync kernel source (manifest) + pin common
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          USE_SOURCE_CACHE: ${{ inputs.use_source_cache }}
        run: |
          set -euo pipefail
          CONFIG="$GITHUB_WORKSPACE/.github/config/android16-6.12.json"
          REMOTE="$(jq -r '.common_remote' "$CONFIG")"
          TAG="$(jq -r '.common_tag' "$CONFIG")"
          PINNED_SHA="$(jq -r '.common_sha // empty' "$CONFIG")"
          BR="common-android16-6.12-${{ matrix.date }}"
          REUSE=0
          if [ "${USE_SOURCE_CACHE:-}" = "true" ] && [ -d kernel/.repo ]; then
            REUSE=1
            echo "Reusing cached kernel source"
          else
            rm -rf kernel
          fi
          mkdir -p kernel && cd kernel
          SYNCED=0
          if [ "$REUSE" -eq 1 ]; then
            for i in 1 2 3; do
              if timeout 15m ~/bin/repo sync -c --current-branch --no-clone-bundle --no-tags -j4; then
                echo "Sync OK (cached source, attempt $i)"
                SYNCED=1
                break
              fi
              echo "Cached sync attempt $i failed; retrying..."
              [ "$i" -eq 3 ] || sleep 15
            done
            if [ "$SYNCED" -ne 1 ]; then
              echo "Cached source did not sync; discarding it and cloning fresh"
              rm -rf .repo common build 2>/dev/null || true
              REUSE=0
            fi
          fi
          if [ "$REUSE" -eq 0 ]; then
            for i in 1 2 3; do
              rm -rf .repo common build 2>/dev/null || true
              if ~/bin/repo init -u https://android.googlesource.com/kernel/manifest \
                  -b "$BR" --depth=1; then
                if timeout 15m ~/bin/repo sync -c --current-branch --no-clone-bundle --no-tags -j4; then
                  echo "Sync OK (fresh clone, attempt $i)"
                  break
                fi
              fi
              echo "Attempt $i failed; retrying..."
              [ "$i" -eq 3 ] && exit 1
              sleep 15
            done
          fi
          cd common
          git fetch --depth=1 "$REMOTE" "refs/tags/$TAG:refs/tags/$TAG"
          if [ -n "$PINNED_SHA" ]; then
            git checkout "$PINNED_SHA"
          else
            git checkout "$TAG"
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "manifest_branch=$BR"
          echo "common_tag=$TAG"
          echo "common_sha=$ACTUAL_SHA"
          if [ -n "$PINNED_SHA" ] && [ "$ACTUAL_SHA" != "$PINNED_SHA" ]; then
            echo "::error::Pinned source mismatch: expected $PINNED_SHA, got $ACTUAL_SHA" >&2
            exit 1
          fi

      - name: Save kernel source cache
        if: inputs.use_source_cache && steps.restore-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: kernel
          key: kernel-src-android16-6.12-${{ matrix.sublevel }}-${{ matrix.date }}-${{ hashFiles('.github/config/android16-6.12.json') }}

      - name: Verify pin 6.12.38
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          V="$(make kernelversion)"
          echo "kernelversion=$V"
          echo "$V" | grep -q '^6\.12\.38' || { echo "::error::Expected 6.12.38, got $V"; exit 1; }
          git log -1 --format='%H %cI %s'
          echo "$V" > "$GITHUB_WORKSPACE/kernelversion.txt"

      - name: Apply optional kernel branding
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BRAND="${{ inputs.brand_name }}"
          SL="kernel/common/scripts/setlocalversion"
          if ! grep -q 'scm_version}"' "$SL"; then
            echo "::error::Unexpected scripts/setlocalversion format" >&2
            exit 1
          fi
          sed -i '$d' "$SL"
          if [ -z "$BRAND" ]; then
            # Empty brand pins the stock version string.
            cat >> "$SL" <<'EOF'
          echo "${KERNELVERSION}${file_localversion}${config_localversion}${LOCALVERSION}$(scm_version | sed 's/-dirty$//')"
          EOF
            echo "brand_name is empty; stock version pinned without -dirty suffix"
          else
            ANDROID_PART="$(jq -r '.version | split("-")[0]' .github/config/android16-6.12.json)"
            KERNEL_PART="$(jq -r '.version | split("-")[1]' .github/config/android16-6.12.json)"
            KMI="$(grep -h '^KMI_GENERATION' kernel/common/build.config.common kernel/common/build.config.constants 2>/dev/null | head -n 1 | cut -d= -f2 || true)"
            if [ -z "$KMI" ]; then
              echo "::error::KMI_GENERATION not found; cannot apply KMI-preserving branding" >&2
              exit 1
            fi
            echo "echo \"$KERNEL_PART.${{ matrix.sublevel }}-$ANDROID_PART-$KMI-$BRAND\"" >> "$SL"
          fi
          chmod +x "$SL"
          tail -n 1 "$SL"

      - name: Apply version-mismatch bypass
        if: inputs.allow_version_mismatch
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          TARGET="kernel/module/version.c"
          if [ ! -f "$TARGET" ]; then
            TARGET="kernel/module.c"
          fi
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET"
          if ! grep -A 5 'bad_version:' "$TARGET" | grep -q 'return 1;'; then
            echo "::error::Bypass patch failed; 'return 1;' not found at bad_version" >&2
            grep -A 10 'bad_version:' "$TARGET" || true
            exit 1
          fi
          echo "Version-mismatch bypass applied to $TARGET"

      - name: Restore bazel cache
        if: inputs.use_cache
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/bazel
          key: bazel-android16-6.12.38-${{ matrix.date }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            bazel-android16-6.12.38-${{ matrix.date }}-
            bazel-android16-6.12.38-
            bazel-

      - name: Glibc >= 2.38 fix (resolve_btfids)
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          set -euo pipefail
          F="tools/bpf/resolve_btfids/Makefile"
          if [ -f "$F" ] && grep -q 'OUTPUT=$(abspath $(dir $@))' "$F" && ! grep -q 'EXTRA_CFLAGS' "$F"; then
            sed -i 's|OUTPUT=$(abspath $(dir $@))|EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))|' "$F"
            echo "resolve_btfids fix applied"
          else
            echo "resolve_btfids fix not needed"
          fi

      - name: Remove protected exports (Wild-style)
        if: inputs.remove_protected_exports
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          rm -rf common/android/abi_gki_protected_exports_*
          if ls -1 common/android/abi_gki_protected_exports_* >/dev/null 2>&1; then
            echo "::error::abi_gki_protected_exports_* still present after removal" >&2
            ls -la common/android/abi_gki_protected_exports_* || true
            exit 1
          fi
          if grep -q '"protected_exports_list"[[:space:]]*:[[:space:]]*"android/abi_gki_protected_exports_aarch64"' common/BUILD.bazel; then
            BEFORE="$(sha256sum common/BUILD.bazel | awk '{print $1}')"
            perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' common/BUILD.bazel
            AFTER="$(sha256sum common/BUILD.bazel | awk '{print $1}')"
            [ "$BEFORE" != "$AFTER" ] || { echo "::error::common/BUILD.bazel was not modified" >&2; exit 1; }
            grep -q '"protected_exports_list"[[:space:]]*:[[:space:]]*"android/abi_gki_protected_exports_aarch64"' common/BUILD.bazel && { echo "::error::protected_exports_list still referenced" >&2; exit 1; }
          fi
          if grep -q '^protected_modules = ' common/modules.bzl; then
            BEFORE="$(sha256sum common/modules.bzl | awk '{print $1}')"
            sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl
            AFTER="$(sha256sum common/modules.bzl | awk '{print $1}')"
            [ "$BEFORE" != "$AFTER" ] || { echo "::error::common/modules.bzl was not modified" >&2; exit 1; }
            grep -q '^protected_modules = \[\]' common/modules.bzl || { echo "::error::protected_modules was not reset" >&2; exit 1; }
          fi
          if grep -q 'protected_module_names_list' common/BUILD.bazel; then
            perl -pi -e 's/^\s*protected_module_names_list\s*=\s*":gki_(?:aarch64|x86_64)_protected_module_names",\s*$//;' common/BUILD.bazel
            grep -q 'protected_module_names_list' common/BUILD.bazel && { echo "::error::protected_module_names_list still referenced" >&2; exit 1; }
          fi
          echo "Protected exports removed"

      - name: Setup root implementation
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
          WITH_SUSFS: ${{ inputs.with_susfs }}
        run: |
          set -euo pipefail
          if [ "$ROOT_FLAVOR" = "baseline" ]; then
            if [ "$WITH_SUSFS" = "true" ]; then
              echo "::error::with_susfs requires a root flavor; baseline carries no KSU source to attach SUSFS to" >&2
              exit 1
            fi
            echo "baseline selected; skipping root integration"
            exit 0
          fi
          case "$ROOT_FLAVOR" in
            ksu)
              REPO="https://github.com/tiann/KernelSU.git"
              BRANCH="main"
              DIR="KernelSU"
              ;;
            ksunext)
              DIR="KernelSU-Next"
              if [ "$WITH_SUSFS" = "true" ]; then
                REPO="https://github.com/pershoot/KernelSU-Next.git"
                BRANCH="dev-susfs"
              else
                REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
                BRANCH="dev"
              fi
              ;;
            sukisu-ultra)
              REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
              DIR="SukiSU-Ultra"
              if [ "$WITH_SUSFS" = "true" ]; then
                BRANCH="builtin"
              else
                BRANCH="main"
              fi
              ;;
            resukisu)
              REPO="https://github.com/ReSukiSU/ReSukiSU.git"
              BRANCH="main"
              DIR="ReSukiSU"
              ;;
            *)
              echo "::error::unknown root_flavor: $ROOT_FLAVOR" >&2
              exit 1
              ;;
          esac
          for CAND in KernelSU KernelSU-Next ReSukiSU SukiSU-Ultra; do
            if [ "$CAND" != "$DIR" ] && [ -e "$CAND" ]; then
              echo "::error::refusing mixed root implementations: found $CAND" >&2
              exit 1
            fi
          done
          if [ -e common/drivers/kernelsu ] || [ -L common/drivers/kernelsu ]; then
            echo "::error::refusing to replace an existing kernelsu integration" >&2
            exit 1
          fi
          SHA="$(git ls-remote "$REPO" "refs/heads/$BRANCH" | awk '{print $1; exit}')"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::failed to resolve $REPO@$BRANCH (got: ${SHA:-empty})" >&2
            exit 1
          fi
          git clone --no-checkout "$REPO" "$DIR"
          git -C "$DIR" fetch --depth=1 origin "$SHA"
          git -C "$DIR" checkout --detach "$SHA"
          [ "$(git -C "$DIR" rev-parse HEAD)" = "$SHA" ] || { echo "::error::root commit mismatch" >&2; exit 1; }
          [ -f "$DIR/kernel/Kconfig" ] && [ -f "$DIR/kernel/Makefile" ] || { echo "::error::$DIR@$BRANCH@$SHA has no kernel integration" >&2; exit 1; }
          REL="$(realpath --relative-to=common/drivers "$PWD/$DIR/kernel")"
          ln -s "$REL" common/drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          [ "$(grep -c '^endmenu' common/drivers/Kconfig)" = "1" ] || { echo "::error::unexpected endmenu count in common/drivers/Kconfig" >&2; exit 1; }
          grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
          grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig || { echo "::error::Kconfig wiring failed" >&2; exit 1; }
          DEF="common/arch/arm64/configs/gki_defconfig"
          grep -q '^CONFIG_KSU=y$' "$DEF" || echo 'CONFIG_KSU=y' >> "$DEF"
          if [ "$ROOT_FLAVOR" = "ksunext" ]; then
            if grep -q 'KernelSU requires either CONFIG_KPROBES' common/drivers/kernelsu/Kbuild 2>/dev/null; then
              sed -i 's/$(error "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/$(warning "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/' common/drivers/kernelsu/Kbuild
            fi
          fi
          if [ "$ROOT_FLAVOR" = "resukisu" ]; then
            grep -q '^CONFIG_KSU_MULTI_MANAGER_SUPPORT=n$' "$DEF" || echo 'CONFIG_KSU_MULTI_MANAGER_SUPPORT=n' >> "$DEF"
            grep -q '^CONFIG_KSU_TOOLKIT_SUPPORT=y$' "$DEF" || echo 'CONFIG_KSU_TOOLKIT_SUPPORT=y' >> "$DEF"
            if grep -q 'as a git submodule instead of copying code directly' "$DIR/kernel/Kbuild" 2>/dev/null; then
              sed -i 's/$(error You should use $(REPO_NAME) as a git submodule instead of copying code directly)/$(warning You should use $(REPO_NAME) as a git submodule instead of copying code directly)/' "$DIR/kernel/Kbuild"
            fi
          fi
          echo "root_flavor=$ROOT_FLAVOR root_repo=$REPO root_branch=$BRANCH root_commit=$SHA"
          echo "ROOT_COMMIT=$SHA" >> "$GITHUB_ENV"

      - name: Apply SUSFS patches
        if: inputs.with_susfs
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
        run: |
          set -euo pipefail
          BRANCH="gki-android16-6.12"
          git clone --depth=1 -b "$BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          SHA="$(git -C susfs4ksu rev-parse HEAD)"
          echo "susfs_branch=$BRANCH susfs_commit=$SHA"
          echo "SUSFS_COMMIT=$SHA" >> "$GITHUB_ENV"
          if [ "$ROOT_FLAVOR" = "ksu" ]; then
            PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            [ -f "$PATCH" ] || { echo "::error::missing $PATCH" >&2; exit 1; }
            patch --forward -p1 -d kernel/KernelSU < "$PATCH"
          fi
          DEF="kernel/common/arch/arm64/configs/gki_defconfig"
          while IFS= read -r LINE; do
            [ -n "$LINE" ] || continue
            KEY="${LINE%%=*}"
            if grep -q "^$KEY=" "$DEF"; then
              sed -i "s|^$KEY=.*|$LINE|" "$DEF"
            else
              echo "$LINE" >> "$DEF"
            fi
          done <<'OPTS'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          OPTS
          cp -a susfs4ksu/kernel_patches/fs/. kernel/common/fs/
          cp -a susfs4ksu/kernel_patches/include/linux/. kernel/common/include/linux/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch kernel/common/
          patch --forward -p1 -d kernel/common < kernel/common/50_add_susfs_in_gki-android16-6.12.patch
          if grep -q 'VMA_PAD_START(' kernel/common/fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' kernel/common/fs/proc/task_mmu.c; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' kernel/common/fs/proc/task_mmu.c
          fi
          FOUND="$(find kernel/common -name selinux_hide.c 2>/dev/null || true)"
          [ -n "$FOUND" ] || echo "::warning::selinux_hide.c not found under kernel/common; skipping pointer fix"
          for F in $FOUND; do
            if grep -q "extern void security_dump_masked_av_fn" "$F"; then
              sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$F"
              sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$F"
              sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$F"
              sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$F"
              echo "patched $F (function form)"
            elif grep -q "if (security_dump_masked_av_fn" "$F"; then
              sed -i 's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' "$F"
              sed -i 's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' "$F"
              echo "patched $F (pointer form)"
            else
              echo "$F already patched"
            fi
          done
          echo "SUSFS applied"

      - name: Apply config fragment
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          FRAG="configs/baseline.fragment"
          DEF="kernel/common/arch/arm64/configs/gki_defconfig"
          [ -f "$DEF" ] || { echo "::error::$DEF not found" >&2; exit 1; }
          BAD="$(grep -vE '^\s*(#|$)' "$FRAG" | grep -vE '^CONFIG_[A-Za-z0-9_]+=.+' || true)"
          [ -z "$BAD" ] || { echo "::error::malformed fragment lines:" >&2; echo "$BAD" >&2; exit 1; }
          OPTS="$(grep -vE '^\s*(#|$)' "$FRAG" || true)"
          if [ -n "$OPTS" ]; then
            while IFS= read -r LINE; do
              KEY="${LINE%%=*}"
              if grep -q "^$KEY=" "$DEF"; then
                sed -i "s|^$KEY=.*|$LINE|" "$DEF"
              else
                echo "$LINE" >> "$DEF"
              fi
            done <<< "$OPTS"
            echo "fragment applied:"
            echo "$OPTS"
          else
            echo "fragment empty; nothing to apply"
          fi

      - name: Build kernel Image
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          # Kleaf-only: this manifest branch has no build/build.sh.
          METHOD="${{ inputs.build_method }}"
          if [ "$METHOD" != "auto" ] && [ "$METHOD" != "kleaf" ]; then
            echo "::error::Unknown build_method: $METHOD (expected auto or kleaf)" >&2
            exit 1
          fi
          echo "build_method=$METHOD (kleaf)"
          sed -i 's/check_defconfig//' ./common/build.config.gki 2>/dev/null || true
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          tools/bazel build --config=fast \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image

      - name: Gather artifacts
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
          WITH_SUSFS: ${{ inputs.with_susfs }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f "kernel/bazel-bin/common/kernel_aarch64/Image" ]; then
            cp kernel/bazel-bin/common/kernel_aarch64/Image dist/Image
          elif [ -f "/home/runner/out/dist/Image" ]; then
            cp /home/runner/out/dist/Image dist/Image
          else
            echo "::error::Image not found; checked bazel-bin and out/dist"
            exit 1
          fi
          cd kernel/common
          SHA="$(git rev-parse HEAD)"
          DATE="$(git log -1 --format=%cI)"
          MSG="$(git log -1 --format=%s)"
          cd "$GITHUB_WORKSPACE"
          TAG="$(jq -r '.common_tag' .github/config/android16-6.12.json)"
          REMOTE="$(jq -r '.common_remote' .github/config/android16-6.12.json)"
          FRAG_SHA="$(sha256sum configs/baseline.fragment | awk '{print $1}')"
          NOTES="stock (no root, no tweaks)"
          if [ "$ROOT_FLAVOR" != "baseline" ]; then
            NOTES="$ROOT_FLAVOR"
            [ "$WITH_SUSFS" = "true" ] && NOTES="$NOTES+susfs"
          fi
          cat > dist/BuildInfo.txt <<EOF
          version=6.12.38-android16-${{ matrix.date }}
          common_remote=$REMOTE
          common_tag=$TAG
          common_sha=$SHA
          common_date=$DATE
          common_msg=$MSG
          config_fragment=$FRAG_SHA
          brand_name=${{ inputs.brand_name }}
          allow_version_mismatch=${{ inputs.allow_version_mismatch }}
          use_source_cache=${{ inputs.use_source_cache }}
          free_disk_space=${{ inputs.free_disk_space }}
          build_method=${{ inputs.build_method }}
          remove_protected_exports=${{ inputs.remove_protected_exports }}
          root_flavor=${{ inputs.root_flavor }}
          with_susfs=${{ inputs.with_susfs }}
          root_commit=${ROOT_COMMIT:-}
          susfs_commit=${SUSFS_COMMIT:-}
          notes=$NOTES
          EOF
          cat dist/BuildInfo.txt

      - name: Upload Image + BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: Image-6.12.38-android16-${{ matrix.date }}
          path: |
            dist/Image
            dist/BuildInfo.txt
            kernelversion.txt
          if-no-files-found: error
